name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent "Terminal Manager.app" TerminalManager.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TerminalManager
          path: build/TerminalManager.zip
